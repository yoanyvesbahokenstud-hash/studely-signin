version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # API_BASE_URL / AUTH_BASE_URL : variables d'environnement Amplify, injectées par `npm run build`.
        - npm run build
  artifacts:
    # Angular (@angular/build) génère index.html dans le sous-dossier `browser/`.
    baseDirectory: dist/studely-signing-front/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
